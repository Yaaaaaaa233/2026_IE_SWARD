# Public template. Copy to an ignored local file before filling local paths.
data_root: "../data/contract_v0_1"
table_layer: "v4_assessed"
imu_layer: "v1_annotated"
output_dir: "../artifacts/feature_f0"

imu:
  workers: 2
  block_size_mb: 64
  impact_moderate_g: 0.35
  impact_severe_g: 0.75
  impact_extreme_g: 1.50
  lateral_instability_g: 0.35
  tilt_deviation_g: 0.35
  rotation_severe_dps: 45.0
  rotation_extreme_dps: 90.0
  moving_speed_kmh: 10.0

clustering:
  min_clusters: 2
  max_clusters: 8
  random_state: 42
  n_init: 30
  min_trajectory_km: 1.0
  min_imu_rows: 1000

name: Governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check committed governance
        run: python tools/check_governance.py --scope head
      - name: Test checks with synthetic repositories
        run: python -m unittest discover -s tests -v
